<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея профилей</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="theme-toggle" onclick="document.body.classList.toggle('dark')">
        🌓 Тема
    </button>

    <h1 class="page-title">Наша команда</h1>

    <section class="team">
        <article class="profile">
            <span class="badge">NEW</span>

            <p class="role">Стекломойщик</p>
            <p class="bio">Кушать.</p>
            <label class="fav">
                <input type="checkbox">
                <span>В избранное</span>
            </label>
            <a href="#" class="btn">Связаться</a>
        </article>

        <article class="profile">
            <span class="avatar">🫦</span>
            <h2 class="name">Карина Эдуардовна</h2>
            <p class="role">Королева Дятлова</p>
            <p class="bio">Люблю пить кофе.</p>
            <a href="#" class="btn">Связаться</a>
        </article>

        <article class="profile">
            <span class="badge">NEW</span>
            <span class="avatar">🥸</span>
            <h2 class="name">Самира Тухвату(одна Л)ина</h2>
            <p class="role">Богиня</p>
            <p class="bio">Благославляет нищих рабов.</p>
            <a href="#" class="btn">Связаться</a>
        </article>

        <article class="profile">
            <span class="badge">NEW</span>
            <span class="avatar">💄</span>
            <h2 class="name">Абрамова дашка</h2>
            <p class="role">Зубрила(госпожа)</p>
            <p class="bio">Даёт списывать.</p>
            <a href="#" class="btn">Связаться</a>
        </article>
    </section>
</body>
</html>
